variables:
  # Default IMAGE_VERSION is empty so GitLab shows it in the UI as optional
  IMAGE_VERSION: ""

stages:
  - build

container-image-dev:
  services:
    - docker:20.10.15-dind-alpine3.15
  image: docker:20.10.15-alpine3.15
  stage: build
  before_script:
    - apk add --no-cache docker-cli-buildx
  script:
    - >-
      docker buildx build
      --file=Dockerfile
      --tag=run
      --target=run
      .
    - |-
      # If IMAGE_VERSION is empty, calculate default
      if [ -z "${IMAGE_VERSION}" ]; then
        IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
      fi
      if [ "${CI_COMMIT_BRANCH}" == "main" ]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        docker tag run omnileads/fastagi:$IMAGE_VERSION
        docker push docker.io/omnileads/fastagi:$IMAGE_VERSION
      else
        echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
        docker tag run freetechsolutions/fastagi:$IMAGE_VERSION
        docker push docker.io/freetechsolutions/fastagi:$IMAGE_VERSION
      fi  
  only:
    - web
