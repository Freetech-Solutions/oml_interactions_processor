# Unique identifier of the project in SonarQube
sonar.projectKey=omnileads-postcall-actions

# Name of the project
sonar.projectName=OMniLeads Postcall Actions

# Path to the source directories
sonar.sources=.

# Exclude build artifacts and dependencies from source analysis
sonar.exclusions=**/__pycache__/**, **/.pytest_cache/**, **/venv/**, **/.venv/**, **/htmlcov/**

# Path to test files
sonar.tests=.
sonar.test.inclusions=**/tests.py, test_*.py

# Encoding of the source files
sonar.sourceEncoding=UTF-8
